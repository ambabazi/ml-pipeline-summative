resolver 127.0.0.11 valid=5s ipv6=off;    # Docker's internal DNS; re-check every 5 s which containers exist

upstream neurotrace_api {
    zone neurotrace_api 64k;              # shared memory so the server list can update while running
    server api:8000 resolve;              # "api" resolves to EVERY api container -> round-robin between them
}

server {
    listen 80;
    client_max_body_size 200M;            # allow large bulk uploads (default is only 1 MB!)
    location / {
        proxy_pass http://neurotrace_api; # forward every request to one of the api containers
        proxy_set_header Host $host;      # pass the original host name along
        proxy_read_timeout 300s;          # don't cut off slow requests
    }
}