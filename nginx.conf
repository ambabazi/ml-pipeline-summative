# Re-resolve the API service as Docker replicas change.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream neurotrace_api {
    zone neurotrace_api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    client_max_body_size 200M;
    location / {
        proxy_pass http://neurotrace_api;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
