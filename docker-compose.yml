services:
  api:
    build: .
    volumes:
      - models:/app/models
      - uploads:/app/data/uploads
    expose:
      - "8000"
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    environment:
      API_URL: http://nginx
    volumes:
      - ./reports:/app/reports:ro
    depends_on:
      - nginx

volumes:
  models:
  uploads:
